[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether"
version = "0.0.1"
description = "A Python framework for building AI-native applications: provider abstraction, tool registries, memory, resilience, and observability."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pronob Mozumder", email = "pronobmozumder.info@gmail.com" }]
keywords = ["llm", "ai", "agents", "openai", "gemini", "framework", "tools", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Core runtime dependencies. Provider SDKs are lazy-imported and live in
# optional extras below so the base install stays small.
dependencies = [
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
gemini = ["google-genai>=0.3"]
anthropic = ["anthropic>=0.40"]
http = ["httpx>=0.24"]
# Everything a user might want to run all built-in providers/tools.
all = ["openai>=1.0", "google-genai>=0.3", "anthropic>=0.40", "httpx>=0.24"]
# Development & CI toolchain.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "openai>=1.0",
    "google-genai>=0.3",
    "anthropic>=0.40",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/pronob1010/aether"
Repository = "https://github.com/pronob1010/aether"

[tool.hatch.build.targets.wheel]
packages = ["aether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# A pragmatic default set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), bugbear (B), and flake8-comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Provider SDKs are optional/lazy-imported; don't fail on missing stubs.
ignore_missing_imports = true
